[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-point-order-finding"
version = "0.0.0"
description = "Research software for elliptic-curve point order finding"
requires-python = ">=3.10"
dependencies = ["qiskit==2.0.0", "numpy==2.1.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = '-m "not slow" --strict-markers'
filterwarnings = [
    'ignore:The method ``qiskit\.circuit\.library\.standard_gates\.x\.MCXGate\.get_num_ancilla_qubits\(\)`` is pending deprecation:PendingDeprecationWarning:qiskit\.circuit\.library\.standard_gates\.x',
]
markers = [
    "slow: exhaustive or expensive validation excluded from default runs",
]
